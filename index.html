<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>معايدة إيمي الملكية ✨</title>
  <!-- الخط الكوفي الأصيل -->
  <link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #d4af37;
      --gold-light: #fef1d2;
      --navy-bg: #030710;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Reem Kufi', sans-serif;
    }

    body {
      background-color: var(--navy-bg);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
      color: #ffffff;
      overflow-x: hidden;
    }

    /* الإطار الرئيسي المضبوط تماماً لمنع أي تكرار سفلي للصورة */
    .card-frame {
      position: relative;
      width: 100%;
      max-width: 410px;
      height: 720px;
      border-radius: 18px;
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.95);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding: 15px;
      background: #030710;
    }

    /* الصورة الخلفية مع منع التكرار تماماً */
    .bg-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill; /* تمدد الصورة لتغطي الحاوية بالكامل بدون تكرار */
      z-index: 1;
      pointer-events: none;
    }

    /* الدائرة العلوية لصورة إيمي - معيرة بالمليمتر لتجلس داخل إطار الجليتر الذهبي */
    .photo-circle-trigger {
      position: absolute;
      top: 38px;
      left: 42px;
      width: 132px;
      height: 132px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      clip-path: circle(50% at 50% 50%);
    }

    .photo-circle-trigger img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .photo-hint {
      font-size: 0.75rem;
      color: var(--gold-light);
      font-weight: 700;
      text-align: center;
      background: rgba(0, 0, 0, 0.55);
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid rgba(212, 175, 55, 0.6);
    }

    /* منطقة المحتوى في منتصف البطاقة */
    .content-area {
      position: relative;
      z-index: 5;
      margin-top: 185px;
      text-align: center;
      padding: 0 8px;
    }

    .title-name {
      font-size: 3.3rem;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 0 15px rgba(212, 175, 55, 0.9), 2px 2px 6px rgba(0,0,0,0.9);
      margin-bottom: 2px;
      letter-spacing: 1px;
    }

    .badge-sub {
      display: inline-block;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--gold);
      color: var(--gold-light);
      padding: 3px 16px;
      border-radius: 20px;
      font-size: 0.88rem;
      font-weight: 700;
      margin-bottom: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }

    /* المستطيل الزجاجي لرسالة المعايدة */
    .greeting-box {
      font-size: 0.96rem;
      line-height: 1.8;
      color: #ffffff;
      background: rgba(8, 16, 32, 0.45);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 13px 15px;
      border-radius: 14px;
      border-right: 4px solid var(--gold);
      border-top: 1px solid rgba(212, 175, 55, 0.3);
      border-bottom: 1px solid rgba(212, 175, 55, 0.3);
      border-left: 1px solid rgba(212, 175, 55, 0.3);
      margin-bottom: 10px;
      text-align: justify;
      text-align-last: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    }

    /* المستطيل الزجاجي لمفتاح النكد */
    .nakad-panel {
      background: rgba(8, 16, 32, 0.45);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(212, 175, 55, 0.5);
      border-right: 4px solid var(--gold);
      padding: 9px 14px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
    }

    .nakad-info {
      text-align: right;
    }

    .nakad-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--gold-light);
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    }

    .nakad-status {
      font-size: 0.78rem;
      color: #ff5252;
      font-weight: 700;
      margin-top: 1px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    }

    .nakad-status.off {
      color: #4caf50;
    }

    /* مفتاح التشغيل والإيقاف */
    .custom-switch {
      position: relative;
      width: 52px;
      height: 26px;
    }

    .custom-switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      inset: 0;
      background: rgba(229, 57, 53, 0.85);
      border-radius: 26px;
      border: 1px solid var(--gold);
      cursor: pointer;
      transition: 0.3s;
    }

    .slider::before {
      content: "ON";
      position: absolute;
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background: #ffffff;
      color: #e53935;
      font-size: 0.52rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: 0.3s;
    }

    input:checked + .slider {
      background: rgba(67, 160, 71, 0.85);
    }

    input:checked + .slider::before {
      transform: translateX(25px);
      content: "OFF";
      color: #43a047;
    }

    /* الأزرار الملكية */
    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      z-index: 5;
    }

    .action-btn {
      background: linear-gradient(135deg, rgba(254, 241, 210, 0.9) 0%, rgba(212, 175, 55, 0.9) 100%);
      color: #03060d;
      border: 1px solid var(--gold);
      padding: 9px 16px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(4px);
    }

    /* التنبيهات */
    #toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(3, 7, 15, 0.95);
      border: 1px solid var(--gold);
      color: #fff;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      opacity: 0;
      transition: all 0.3s;
      z-index: 1000;
      text-align: center;
      max-width: 90%;
    }

    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    #confetti-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
    }
  </style>
</head>
<body>

  <canvas id="confetti-canvas"></canvas>

  <div class="card-frame">
    <!-- الصورة الخلفية المضبوطة بدقة بدون أي تكرار -->
    <img src="bg.jpg" class="bg-image" alt="الخلفية الملكية">

    <!-- الدائرة العلوية لصورة إيمي - في الموقع والقياس الصح بالضبط -->
    <div class="photo-circle-trigger" onclick="document.getElementById('photoInput').click()">
      <div id="circleContent">
        <div class="photo-hint">إضافة صورة 📷</div>
      </div>
    </div>
    <input type="file" id="photoInput" accept="image/*" style="display: none;" onchange="loadPhoto(event)">

    <!-- المحتوى التفاعلي الزجاجي بالمنتصف -->
    <div class="content-area">
      <h1 class="title-name">إيمي</h1>
      <div class="badge-sub">✨ كل عام وأنتِ بخير وسعادة ✨</div>

      <!-- مستطيل النص الزجاجي -->
      <div class="greeting-box">
        إيمي الحنونة النكدية، كل عام وأنتِ بخير وسعادة. يلي بيعرف قلبك الطيب والحنون بيعرف قديش أنتِ شخص استثنائي، حتى لو كان وضع (النكد) عندك بيشتغل أوتوماتيك أحيانًا! عقبال العمر كله يا رب. ❤️✨
      </div>

      <!-- مستطيل النكد الزجاجي -->
      <div class="nakad-panel">
        <div class="nakad-info">
          <div class="nakad-title">وضع النكد الأوتوماتيكي ⚡</div>
          <div class="nakad-status" id="statusText">الحالة: شغال بكامل الطاقات! 😈</div>
        </div>
        <label class="custom-switch">
          <input type="checkbox" id="nakadToggle" onchange="toggleNakad(this)">
          <span class="slider"></span>
        </label>
      </div>

      <!-- الأزرار -->
      <div class="btn-group">
        <button class="action-btn" onclick="toggleAudio()">
          <span id="audioIcon">🎵</span> <span id="audioText">تشغيل الأغنية</span>
        </button>
        <button class="action-btn" onclick="launchConfetti()">
          <span>🎉</span> إطلاق احتفال
        </button>
      </div>
    </div>
  </div>

  <!-- ملف الأغنية الخاص بك -->
  <audio id="bgMusic" loop preload="auto">
    <source src="song.mp3" type="audio/mpeg">
  </audio>

  <div id="toast"></div>

  <script>
    function loadPhoto(event) {
      const reader = new FileReader();
      reader.onload = function() {
        const circle = document.getElementById('circleContent');
        circle.innerHTML = `<img src="${reader.result}" alt="صورة إيمي">`;
        showToast("تم إضافة الصورة داخل الإطار الذهبي بنجاح! 👑✨");
      }
      reader.readAsDataURL(event.target.files[0]);
    }

    let nakadTimer = null;
    function toggleNakad(checkbox) {
      const statusText = document.getElementById('statusText');
      if (checkbox.checked) {
        statusText.innerText = "الحالة: تم الإيقاف (طاقة الحب 100%) 💖";
        statusText.classList.add('off');
        launchConfetti();
        showToast("تم إيقاف النكد بنجاح! 🥳 (سيعود تلقائياً بعد 7 ثوانٍ)");

        clearTimeout(nakadTimer);
        nakadTimer = setTimeout(() => {
          checkbox.checked = false;
          toggleNakad(checkbox);
          showToast("⚠️ عذراً إيمي! انتهت المهلة وعاد النكد تلقائياً! 😂");
        }, 7000);
      } else {
        statusText.innerText = "الحالة: شغال بكامل الطاقات! 😈";
        statusText.classList.remove('off');
        clearTimeout(nakadTimer);
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    const music = document.getElementById('bgMusic');
    let isPlaying = false;

    function toggleAudio() {
      if (isPlaying) {
        music.pause();
        isPlaying = false;
        document.getElementById('audioIcon').innerText = '🎵';
        document.getElementById('audioText').innerText = 'تشغيل الأغنية';
      } else {
        music.play().then(() => {
          isPlaying = true;
          document.getElementById('audioIcon').innerText = '⏸️';
          document.getElementById('audioText').innerText = 'إيقاف الأغنية';
        }).catch(() => {
          showToast("اضغط مرة أخرى لتشغيل الصوت");
        });
      }
    }

    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function launchConfetti() {
      particles = [];
      for (let i = 0; i < 90; i++) {
        particles.push({
          x: canvas.width / 2,
          y: canvas.height / 2,
          vx: (Math.random() - 0.5) * 10,
          vy: (Math.random() - 0.5) * 10,
          size: Math.random() * 6 + 2,
          color: Math.random() > 0.5 ? '#d4af37' : '#ffffff',
          alpha: 1
        });
      }
      animateConfetti();
    }

    function animateConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach((p, index) => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.08;
        p.alpha -= 0.015;

        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        if (p.alpha <= 0) particles.splice(index, 1);
      });

      if (particles.length > 0) requestAnimationFrame(animateConfetti);
    }
  </script>
</body>
</html>
